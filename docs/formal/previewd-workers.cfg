\* MVP regression with two workers: the per-environment lock (docs/formal/V1-model.md section 6.1).
SPECIFICATION Spec

CONSTANTS
    MaxWebhooks = 2
    EnvIDs = {"e1", "e2"}
    Workers = {"w1", "w2"}
    MaxCrashes = 1
    MaxFaults = 1
    SecretChannel = "ramfs_ro_bind"
    Commits = {"c1"}
    UntrustedEnvs = {}
    MaxPermissionLoss = 0
    MaxGhesFaults = 0
    Grace = 1
    MaxPrunes = 0
    TTL = 0
    MaxTicks = 0

\* Every process ends waiting; stuck states are caught by the liveness
\* properties, which treat a deadlock as stuttering.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SafetyZeroSecretLeakage
    SafetyNoOrphanedResources
    SafetyMonotonicity
    SafetyUniqueDelivery
    SafetyOneJobPerEnv
    SafetyLeases
    SafetyRouteImpliesRunning
    SafetyNoUnapprovedUntrusted
    SafetyParkRemovesPrevious
    SafetyRevocationPending
    SafetyFailClosedOnUnavailable
    SafetyPruneKeepsVerdicts
    SafetyPrunedDeliveriesStale
    SafetyPruneKeepsLatest
    SafetyAuthorizedThisBoot

PROPERTIES
    SafetyMonotonicStep
    SafetyAuthorizeChecksBoth
    SafetyApprovalBindsCommit
    SafetyInternalJobsAreNewest
    LivenessEventualCompletion
    LivenessEventualConsistency
    LivenessRevokedTornDown
    LivenessExpired
    LivenessHeadDeployed

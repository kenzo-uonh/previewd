\* Concurrency: two workers contend for the per-environment lock.
SPECIFICATION Spec

CONSTANTS
    MaxWebhooks = 3
    EnvIDs = {"env1", "env2"}
    Workers = {"w1", "w2"}
    MaxCrashes = 1
    MaxFaults = 1
    SecretChannel = "ramfs_ro_bind"

\* Every process ends waiting (stream paused, queue empty). Stuck states are
\* caught by the liveness properties, which treat a deadlock as stuttering.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SafetyZeroSecretLeakage
    SafetyNoOrphanedResources
    SafetyMonotonicity
    SafetyUniqueDelivery
    SafetyOneJobPerEnv
    SafetyLeases
    SafetyRouteImpliesRunning

PROPERTIES
    SafetyMonotonicStep
    LivenessEventualCompletion
    LivenessEventualConsistency

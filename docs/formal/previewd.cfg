\* Default gate: one worker, crash and reboot, one transient teardown fault.
SPECIFICATION Spec

CONSTANTS
    MaxWebhooks = 3
    EnvIDs = {"env1", "env2"}
    Workers = {"w1"}
    MaxCrashes = 1
    MaxFaults = 1
    SecretChannel = "ramfs_ro_bind"

\* Every process ends waiting (stream paused, queue empty). Stuck states are
\* caught by the liveness properties, which treat a deadlock as stuttering.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    SafetyZeroSecretLeakage
    SafetyNoOrphanedResources
    SafetyMonotonicity
    SafetyUniqueDelivery
    SafetyOneJobPerEnv
    SafetyLeases

PROPERTIES
    SafetyMonotonicStep
    LivenessEventualCompletion
    LivenessEventualConsistency

# nfpm package definition for previewd (deb and rpm): `make release`.
# VERSION is passed by the Makefile (PKG_VERSION). The binary is the static
# one from `make build`; the package declares no dependency, Docker Engine
# is installed by the site (docs/deployment.md).
name: previewd
arch: amd64
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: kenzo-uonh <kenzo.uonh@gmail.com>
description: |-
  Sovereign single-node preview environments for GitHub Enterprise Server
  pull requests, on Docker and Traefik, on premises and air-gapped.

contents:
  - src: ./bin/previewd
    dst: /usr/bin/previewd
    file_info:
      mode: 0755
  - src: deployments/previewd.service
    dst: /usr/lib/systemd/system/previewd.service
    file_info:
      mode: 0644
  # Vendor units, replaced on upgrade. Sites never edit them: they override
  # in /etc/systemd/system (docs/deployment.md, Install the package).
  - src: deployments/previewd-builds.slice
    dst: /usr/lib/systemd/system/previewd-builds.slice
    file_info:
      mode: 0644
  - src: deployments/docker.service.d/previewd-builds.conf
    dst: /usr/lib/systemd/system/docker.service.d/previewd-builds.conf
    file_info:
      mode: 0644
  # The ramfs secrets staging root and Traefik as systemd units. Installed,
  # never enabled or started: the site decides (docs/deployment.md).
  - src: deployments/run-previewd-secrets.mount
    dst: /usr/lib/systemd/system/run-previewd-secrets.mount
    file_info:
      mode: 0644
  - src: deployments/previewd-proxy.service
    dst: /usr/lib/systemd/system/previewd-proxy.service
    file_info:
      mode: 0644
  # Site-editable files: an upgrade keeps the operator's copy (conffile on
  # deb, %config(noreplace) on rpm) and never overwrites it.
  - src: deployments/traefik.yml
    dst: /etc/previewd/traefik.yml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: deployments/99-previewd.conf
    dst: /etc/sysctl.d/99-previewd.conf
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  # Refuses the install, before anything is unpacked, on a host without
  # Docker Engine or cgroup v2.
  preinstall: scripts/preinstall.sh
  postinstall: scripts/postinstall.sh
  # On removal (not on upgrade): stops the units, discards staged secrets.
  preremove: scripts/preremove.sh

# Drop-in for docker.service: /etc/systemd/system/docker.service.d/previewd-builds.conf
#
# Two bounds on the engine that runs previewd's builds. Both need cgroup v2:
# on cgroup v1 systemd enforces neither, and previewd starts only with
# PREVIEWD_ALLOW_UNBOUNDED_BUILDS=1 (logged as an error at every start).
#
# 1. Resources (D-V1-4). previewd-builds.slice becomes the daemon's default
#    cgroup parent, so every BuildKit RUN step runs in it, under its limits
#    (the slice unit explains the placement). Install the slice first.
#
#    Every container created without a cgroup parent of its own lands in
#    the slice too. previewd names system.slice for environment containers
#    (orchestrator.EnvCgroupParent) and docker-compose.yml names it for
#    Traefik. Any other container on this host must name one
#    (--cgroup-parent=system.slice): otherwise it shares the builds' limits,
#    and the startup build probe finds the subtree busy and refuses to start.
#
#    The ExecStart below is docker-ce's packaged one plus --cgroup-parent. If
#    your package differs, copy its ExecStart (systemctl cat docker.service)
#    and add the flag. If the site manages /etc/docker/daemon.json, set
#    "cgroup-parent": "previewd-builds.slice" there and drop both ExecStart
#    lines instead: dockerd refuses a directive given both ways.
#
# 2. Egress (D-V1-2, V1-I5). The engine contacts the base image's registry
#    at every build, whatever the pull flag (E0), from the host network
#    namespace where neither the build's network mode nor DOCKER-USER
#    applies. This kernel filter on dockerd's own sockets is the control
#    that stops those connections. Container traffic is routed, not sent by
#    these processes, and is unaffected. Keep dockerd able to reach:
#      - loopback;
#      - the proxy network: docker-proxy runs in this cgroup and forwards
#        connections to the published port 80 that iptables does not
#        rewrite (loopback ones) to Traefik at 172.30.255.2
#        (docker-compose.yml; change both together);
#      - an internal registry mirror, if the site runs one.
#
# Neither bound touches docker.service's own resource settings (dockerd,
# containerd and the shims run no build step), nor previewd.service.
#
# Apply: systemctl daemon-reload && systemctl restart docker
# Check: docker info --format '{{.CgroupDriver}} {{.CgroupVersion}}'   # systemd 2
#        a RUN of `cat /proc/self/cgroup` prints
#        0::/previewd.slice/previewd-builds.slice/docker-<id>.scope
#        systemctl show -p IPAddressDeny docker.service                # any
#        PREVIEWD_BUILDKIT_CGROUP=/sys/fs/cgroup/previewd.slice/previewd-builds.slice \
#          scripts/verify-buildkit.sh          # bound-* and egress-filter cases
[Unit]
Wants=previewd-builds.slice
After=previewd-builds.slice

[Service]
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --cgroup-parent=previewd-builds.slice
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=172.30.255.0/24
# IPAddressAllow=10.20.0.20/32   # internal registry mirror

# /etc/sysctl.d/99-previewd.conf: kernel settings previewd's isolation relies
# on (docs/deployment.md, section 1). Installed by the deb/rpm packages with
# the other config files: your edits survive upgrades. Apply without a
# reboot: sysctl --system
#
# Unprivileged user namespaces: the Docker userns-remap and the unshare
# based air-gap tooling create them. Debian and Ubuntu kernels carry this
# knob; mainline and RHEL-family kernels do not, and govern the same
# capability with user.max_user_namespaces (which must be above 0). The
# leading '-' makes systemd-sysctl ignore a kernel that lacks the knob
# instead of logging a failure at every boot.
-kernel.unprivileged_userns_clone = 1

# Traefik static configuration for previewd.
#
# Routing comes only from the route documents previewd writes into
# PREVIEWD_ROUTES_DIR, mounted read-only at /etc/traefik/routes. There is no
# Docker provider and no Docker socket: a socket gives the proxy host root,
# and a label-reading provider would let a PR image set its own routes.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# No API, no dashboard. The metrics entry point below serves Prometheus
# counters only.

entryPoints:
  web:
    # Bound to the proxy's fixed address on previewd-proxy only. Traefik also
    # joins every environment's internal network (to reach its backend), and
    # must not listen there: a PR container could otherwise reach other
    # environments through it. Keep in sync with docker-compose.yml.
    address: "172.30.255.2:80"
  # Request counters for previewd's ingress activity sensing (V1.2 spec 3.3):
  # the daemon reads /metrics here (PREVIEWD_TRAEFIK_METRICS_ADDR). Bound to
  # the same address as web, for the same reason, and never published to
  # the host's interfaces (docker-compose.yml, previewd-proxy.service): it
  # is reached on previewd-proxy only. It serves counts per router (one
  # router per environment), no request data.
  metrics:
    address: "172.30.255.2:8082"

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    addEntryPointsLabels: false
    addServicesLabels: false

providers:
  file:
    directory: /etc/traefik/routes
    watch: true

log:
  level: INFO
